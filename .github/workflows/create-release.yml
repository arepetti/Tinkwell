name: Create release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release from VersionPrefix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '<VersionPrefix>\K[^<]+' src/app/libs/Directory.Build.props)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read VersionPrefix from src/app/libs/Directory.Build.props"
            exit 1
          fi
          TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Tag: $TAG"

      - name: Check tag does not already exist
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Has this version already been released?"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
